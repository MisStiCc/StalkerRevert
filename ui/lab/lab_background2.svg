<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000">
  <defs>
    <g id="rev" font-family="Impact,'Arial Black',sans-serif" font-size="150" text-anchor="middle">
      <text x="220" y="0">R</text><text x="332" y="0">E</text><text x="444" y="0">V</text>
      <text transform="translate(556,0) scale(-1,1)">E</text>
      <text x="668" y="0">R</text><text x="780" y="0">T</text>
    </g>
    <g id="mt6">
      <circle r="5" fill="#ffb830"/>
      <g stroke="#ffb830" stroke-width="6" fill="none" stroke-linecap="round">
        <path d="M-6.5,-11.3 A13,13 0 0 1 6.5,-11.3"/>
        <path d="M-6.5,-11.3 A13,13 0 0 1 6.5,-11.3" transform="rotate(120)"/>
        <path d="M-6.5,-11.3 A13,13 0 0 1 6.5,-11.3" transform="rotate(240)"/>
      </g>
    </g>
  </defs>
  <rect width="1000" height="1000" fill="#060806"/>
  <g transform="translate(500,560)" fill="none">
    <circle r="215" stroke="#0e180f" stroke-width="16" stroke-dasharray="30 24"/>
  </g>
  <line x1="120" y1="250" x2="880" y2="250" stroke="#233023" stroke-width="2"/>
  <line x1="120" y1="730" x2="880" y2="730" stroke="#233023" stroke-width="2"/>
  <text x="500" y="405" text-anchor="middle" font-family="Impact,'Arial Black',sans-serif" font-size="90" letter-spacing="16" fill="#ded9c9">STALKER</text>
