  <circle cx="905" cy="80" r="6" fill="#ff4646">
    <animate attributeName="opacity" values="1;0.1;1" dur="1.4s" repeatCount="indefinite"/>
  </circle>
  <text x="880" y="86" font-family="Arial,sans-serif" font-size="18" fill="#57755c">REC</text>
